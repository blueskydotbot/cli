version: 2
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
