name: CI
# Automatic triggers are paused during develop-only preparation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.18.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm start
        env:
          DRY_RUN: 'true'
      - run: pnpm test
